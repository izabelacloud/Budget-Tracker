<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="theme-color" content="#0f4c81">
  <link rel="shortcut icon" href="icons/icon-192x192.png" type="image/x-icon">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="/manifest.json">

  <title>Budget Tracker</title>
</head>
<body>
  <header class="app-header">
    <h1>Budget Tracker</h1>
  </header>

  <div class="wrapper">
    <div class="total-card">
      <span class="total-label">Your total is</span>
      <span class="total-value">$<span id="total">0</span></span>
    </div>

    <div class="form">
      <input type="text" id="t-name" placeholder="Name of transaction" />
      <input type="number" min="0" id="t-amount" placeholder="Transaction amount" />
      <div class="form-buttons">
        <button id="add-btn" class="btn btn-add">+ Add Funds</button>
        <button id="sub-btn" class="btn btn-sub">&minus; Subtract Funds</button>
      </div>
      <p class="error"></p>
    </div>

    <div class="transactions">
      <table>
        <thead>
          <tr>
            <th>Transaction</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody id="tbody">

        </tbody>
      </table>
    </div>

    <div class="chart-card">
      <canvas id="myChart"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@2.8.0"></script>
  <script src="js/index.js"></script>
  <script src="./js/idb.js"></script>
</body>
<script>
  (function() {
    if("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./js/service-worker.js")
        .then(() => console.log("Service Worker registered successfully."))
        .catch(error => console.log("Service Worker registration failed:", error));
    }
  })();
  </script>
</html>
